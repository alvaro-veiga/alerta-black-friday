name: alerta

on:
  schedule:
    - cron: "17,47 * * * *"   # reserva, caso a corrente de execuções quebre
  workflow_dispatch:
    inputs:
      duracao:
        description: "Minutos rodando (340 = máximo)"
        default: "340"
      testar_celular:
        description: "Mandar aviso de teste pro celular antes"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: alerta
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recupera estado da última execução
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Teste do celular
        if: ${{ inputs.testar_celular }}
        env:
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
        run: python alerta.py --teste-celular

      - name: Vigia ofertas
        env:
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          MODO: celular
          DURACAO_MINUTOS: ${{ inputs.duracao || '340' }}
        run: python alerta.py

      - name: Salva estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}

      - name: Emenda a próxima execução
        if: ${{ !cancelled() && (inputs.duracao || '340') == '340' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run alerta.yml --ref main -R ${{ github.repository }}
